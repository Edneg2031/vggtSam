# Read-only point-head history experiment. Frozen V0 artifacts are inputs and
# are never overwritten.
v0_config: streaming_couping/configs/v0_baseline.yaml
output_dir: outputs/streaming_couping_geometry_history_selection

history:
  total_frame_budget: 5
  anchor_frames: 1
  qk_overlap_pool_size: 12

evaluation:
  confidence_threshold: 0.30
  alignment_max_points: 30000
  paired_max_points_per_frame: 8192
  symmetric_max_points_per_frame: 512
  compatibility_max_points_per_frame: 4096
  reference_equivalence_max_rmse_native: 0.0001
