# V7.5 is a no-training causality experiment. It reuses the V7.4 dynamic
# SAM3.1/StreamVGGT cache, applies bounded instance ICP and the retained V5
# angular ray-centre solver, and never creates a learned pose checkpoint.
data_config: v74_temporal_data.yaml
output_dir: ../../outputs/streaming_couping_v75_explicit_pose_causality

# Report-only upper bound. These IDs are read only to build GT oracle masks;
# they never enter the SAM variants or any solver decision.
oracle_instance_ids: [37, 68, 54]
translation_weight: 10.0

solver:
  confidence_threshold: 0.30
  # Every mask/full-image control receives the current SAM union's exact
  # capped point budget, preventing point-count advantages.
  min_ray_points: 128
  matched_point_budget: 1024
  max_iterations: 6
  max_condition_number: 100000000.0
  max_ray_rmse: 0.20
  max_center_shift: 0.15
  center_blend: 1.0
  angular_huber_delta: 0.02
  angular_min_range: 0.05

history:
  # Only bounded cdist/ICP runs on this device. Both backbones remain unloaded.
  compute_device: cuda:0
  track_confidence_threshold: 0.50
  min_instance_points: 128
  icp_max_points: 512
  map_max_points: 2048
  icp_iterations: 4
  icp_trim_quantile: 0.70
  min_icp_fitness: 0.25
  max_icp_rmse: 0.03
  correspondence_min_distance: 0.02
  correspondence_object_ratio: 0.05
  max_proposal_translation: 0.15
  consensus_distance: 0.02
