# E1: scoring-only directional audit for the failed E0-r2 edge basin.
# Candidate poses are generated without GT. GT is read only after every fixed
# positive/negative-gradient candidate has been materialized.
e1:
  base_config: v0_baseline.yaml
  e0_config: e0_edge_pose_feasibility.yaml
  output_dir: outputs/streaming_couping_e1_edge_directional_gt_audit
  clip_name: 00a231a370_90_525_step15_37_68_54
  branches:
    - all_edge
    - sam_object_excluded_edge
    - shifted_object_mask_control
  primary_branch: sam_object_excluded_edge
  frames:
    evaluation: [360, 375, 390, 405, 420, 435, 450, 465, 480, 495, 510, 525]
  directional:
    # Rotation and translation gradient blocks are normalized independently.
    # The step therefore cannot be chosen using GT or raw error magnitude.
    rotation_step_degrees: 0.25
    translation_step_scene_fraction: 0.0025
    min_gradient_norm: 1.0e-10
