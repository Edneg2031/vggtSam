# T0 protocol replayed unchanged on the same-scene unseen temporal holdout.
v0_config: streaming_couping/configs/v0_t02_temporal_holdout.yaml
output_dir: outputs/streaming_couping_t02_temporal_holdout_anchor_probe

matching:
  descriptor_level_position: 0
  descriptor_token_half: frame
  track_score_threshold: 0.50
  mask_erosion_pixels: 3
  minimum_patch_coverage: 0.25
  excluded_prompts: [wardrobe]
  qk_history_pool_size: 8
  maximum_queries_per_instance_frame: 64
  maximum_history_views: 4
  minimum_match_similarity: 0.60
  minimum_match_margin: 0.01

triangulation:
  minimum_views: 2
  minimum_ray_angle_degrees: 1.5
  maximum_condition_number: 10000.0
  maximum_mean_reprojection_patch_fraction: 0.75
  maximum_reprojection_patch_fraction: 1.50

controls:
  shifted_mask_fraction_y: 0.25
  shifted_mask_fraction_x: 0.20

evaluation:
  minimum_equal_count: 32
