# V9.5: isolate localized spatial support from correspondence count and solver.
v93_config: streaming_couping/configs/v93_quantization_tolerance.yaml
output_dir: outputs/streaming_couping_v95_spatial_support_scope

# All branches use the same visible local32 count on each fixed edge.
support_scopes:
  - instance_local32
  - full_image_equal_count
  - instance_background_balanced

# Exact is one replicate; noisy branches use five deterministic replicates.
noise_sigmas_pixels: [0.0, 0.5, 1.0]
noise_replicates: 5
noise_seed: 95

# GT-visible dense candidates are an oracle support upper bound only.
max_candidate_queries: 4096
hybrid_background_fraction: 0.5

# Frozen from V9.3/V9.4. The runner also recomputes the V9.3 selector and
# aborts if it no longer produces this exact lock.
fixed_history_edges:
  short:
    360: 330
    375: 360
    390: 360
    405: 375
  medium:
    420: 405
    435: 345
    450: 345
    465: 450
  long:
    480: 465
    495: 405
    510: 495
    525: 495
