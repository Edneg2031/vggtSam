# Read-only pointmap experiment. Formal V0 artifacts are inputs and are never
# overwritten. GT geometry is unavailable to prepare/adapt and enters score
# only after all LoRA states and candidate pointmaps are frozen.
v0_config: streaming_couping/configs/v0_baseline.yaml
output_dir: outputs/streaming_couping_t1_feature_tta

adaptation:
  adaptation_frame_count: 18
  history_drop_probability: 0.50
  seed: 0
  epochs: 5
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip_norm: 1.0
  lora_layers: [4, 11, 17, 23]
  lora_rank: 4
  lora_alpha: 4.0
  lora_dropout: 0.0

evaluation:
  confidence_threshold: 0.30
  alignment_max_points: 30000
  paired_max_points_per_frame: 8192
  symmetric_max_points_per_frame: 512
  minimum_improved_frames: 7
  zero_update_point_rmse_tolerance: 0.0001
  zero_update_confidence_rmse_tolerance: 0.0001
