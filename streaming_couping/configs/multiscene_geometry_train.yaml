# Scene-disjoint pilot on the frozen StreamVGGT feature cache.
cache_index: ${VGGT_SAM_STORAGE_ROOT}/outputs/streaming_couping_multiscene_geometry_r1/cache/index.json
output_dir: ${VGGT_SAM_STORAGE_ROOT}/outputs/streaming_couping_multiscene_geometry_r1/training
device: cuda:0
seed: 2026

epochs: 20
batch_size: 2
learning_rate: 0.0002
weight_decay: 0.0001
grad_clip_norm: 1.0
point_beta: 0.05
correction_regularization_weight: 0.01
