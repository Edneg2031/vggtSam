# V7.1 tests whether instance evidence adds causal value after the camera model
# is frozen. No target from development/future/cross is used for training.
v7_config: streaming_couping/configs/v7_fusion_ablation.yaml
output_dir: outputs/streaming_couping_v71_instance_causality
device: cuda:0

long_clip_name: 00a231a370_90_525_step15_37_68_54
validation_clip_name: 00a231a370_50_80_37_68_54
external_clip_name: 00a231a370_492_589_37_68_54

# The frame-90 reference is context only and is never supervised.
frames:
  # Stage A: train only the camera baseline.
  base_train: [105, 120, 135, 150, 165, 180, 195, 210, 225, 240, 255]
  # Stage B: freeze Stage A and train only one residual branch.
  residual_train: [270, 285, 300, 315, 330, 345]
  # Used for architecture selection together with the separate validation clip.
  development: [360, 375, 390, 405]
  # Strict report-only future frames.
  future: [420, 435, 450, 465, 480, 495, 510, 525]

architectures:
  - camera_extra_all
  - camera_extra_common_gate
  - gate_only
  - appearance_pool
  - geometry_pool
  - decoupled_global
  - local32_decoupled

training:
  base_steps: 1200
  residual_steps: 1200
  seed: 0
