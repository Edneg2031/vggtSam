# V8 O2.6: no-training depth/intrinsics/scale factorization.
theory_config: streaming_couping/configs/v80_theory_validation.yaml
output_dir: outputs/streaming_couping_v80_geometry_factorization

# Locked from the completed O2.5 support sweep. This experiment deliberately
# contains no support hyperparameter search.
fixed_support:
  token_count: 64
  history_count: 2
  match_mode: mutual
  radius_metric: 0.10

# Same-frame GT is used only to diagnose predicted-depth scale/offset. These
# branches are oracle upper bounds and are never deployable inference methods.
oracle_depth_calibration:
  trim_quantile: 0.90
  trim_iterations: 3
  min_pixels: 128
  max_pixels: 65536

gating:
  min_effective_correspondences: 6.0
  min_unique_current_correspondences: 6
  # Each fold has four test frames; require at least three with no worsening.
  min_active_fraction: 0.75
