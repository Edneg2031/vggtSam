# V6 now studies StreamVGGT geometry -> SAM3 segmentation.
# V4/V5 and the historical V6 camera experiments remain unchanged.
base_config: v6_camera_sweep_base.yaml
output_dir: ../../outputs/streaming_couping_v6_geometry_segmentation

sam:
  version: sam3.1
  # Official Hugging Face checkpoint expected by build_sam3_predictor.
  checkpoint: /home/bod/86Nas/95_data_bak/FoundationModels/sam3.1/sam3.1_multiplex.pt
  # Disabled for compatibility with the shared 24 GiB Ampere GPUs.
  use_fa3: false
  max_num_objects: 16
  multiplex_count: 16

geometry_backend:
  type: streamvggt_reference_projection
  point_confidence_threshold: 0.30
  negative_exclusion_radius: 5

model:
  min_candidate_support_recall: 0.25
  support_dilation: 5
  point_positive_samples: 6
  point_negative_samples: 4

  # Trigger geometry correction only when raw SAM3.1 disagrees with the hint.
  adaptive_raw_support_recall: 0.70
  adaptive_raw_box_precision: 0.10
  # The prompted mask must improve both support and the total geometry score.
  adaptive_support_margin: 0.05
  adaptive_score_margin: 0.05
  # Simple protection against replacing a mask with a fragment or huge region.
  adaptive_min_area_ratio: 0.50
  adaptive_max_area_ratio: 4.00
