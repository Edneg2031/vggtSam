# Read-only T0.1 diagnostic. T0 candidates and formal V0 remain unchanged.
t0_output_dir: outputs/streaming_couping_t0_anchor_probe
output_dir: outputs/streaming_couping_t01_triangulation_reliability
branch: correct_persistent_id

# These thresholds are fixed before T0 GT-derived anchor scores are opened.
gate:
  maximum_mean_reprojection_px: 2.0
  minimum_triangulation_angle_degrees: 2.0
  maximum_condition_number: 1000.0
  minimum_views: 2
  strict_minimum_views: 3

evaluation:
  minimum_anchor_count: 30
  minimum_retained_ratio: 0.10
