# V7.2 is self-contained: one frozen early-frame camera baseline, two camera
# capacity controls, then true SAM3.1 mask-local token residuals.
v71_config: streaming_couping/configs/v71_instance_causality.yaml
data_config: streaming_couping/configs/v72_local_token_data.yaml
output_dir: outputs/streaming_couping_v72_local_token_ablation
device: cuda:0

token_counts: [8, 16, 32]
architectures:
  - sam_local_pool
  - sam_local_match
  - geometry_local_match
  - dual_local_match
  - sam_key_global_geometry
  - dual_key_global_geometry

training:
  base_steps: 1200
  residual_steps: 1200
  seed: 0

