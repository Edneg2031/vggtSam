# First multi-scene geometry-only pilot.
# Four complete scenes are available, so this uses a 2/1/1 scene split.
manifest: ${VGGT_SAM_STORAGE_ROOT}/data/processed/scannetpp_pinhole_2d/manifest.json
v0_config: streaming_couping/configs/v0_baseline.yaml
output_dir: ${VGGT_SAM_STORAGE_ROOT}/outputs/streaming_couping_multiscene_geometry_r1/cache

scene_splits:
  train:
    - 00a231a370
    - 0a184cf634
  validation:
    - 1a8e0d78c0
  test:
    - 1eacc65607

# Two separated episodes per scene provide a minimal motion/geometry diversity
# check without materializing all 1,950 frames into the feature cache.
episode_length: 30
episodes_per_scene: 2
devices: [cuda:0, cuda:1]
confidence_threshold: 0.30
max_alignment_points: 30000
