# Train on the retained five supervised frames, then apply each fixed model to
# the complete 30-frame stress-test clip. This is not a generalization claim:
# the long clip intentionally reuses frame 90 as its reference.
base_config: streaming_couping/configs/v6_sam31_long30_base.yaml
output_dir: outputs/streaming_couping_v6_sam31_long30/camera
clip_name: 00a231a370_90_240_37_68_54
test_clip_name: 00a231a370_90_670_step20_37_68_54
validation_clip_name: 00a231a370_50_80_37_68_54
device: cuda:0

model:
  hidden_dim: 256
  num_heads: 8
  dropout: 0.0
  memory_momentum: 0.90
  min_track_confidence: 0.25
  unknown_reliability: 0.50
  identity_gate_policy: soft_unknown_strict_memory
  softened_mismatch_reliability: 0.25
  max_rotation_degrees: 15.0
  max_translation_native: 0.50

training:
  steps: 1200
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip_norm: 5.0
  translation_weight: 10.0
  seed: 0
  log_every: 200

success:
  minimum_loss_drop_percent: 95.0
  maximum_rotation_degrees: 0.10
  maximum_translation_native: 0.005
  instance_loss_ratio: 0.50
  shuffle_loss_ratio: 0.80
  camera_loss_ratio: 0.80
