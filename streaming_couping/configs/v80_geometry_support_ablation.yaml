# V8 O2.5: no-training support and geometry-source diagnosis.
theory_config: streaming_couping/configs/v80_theory_validation.yaml
output_dir: outputs/streaming_couping_v80_geometry_support_ablation

support_sweep:
  token_counts: [32, 64]
  history_counts: [1, 2, 4]
  match_modes: [mutual, one_way]
  radii_metric: [0.10, 0.15]

# Predeclared high-coverage setting used by the compact geometry table. The
# full support sweep remains report-only and does not select this setting.
primary_support:
  # Select the lightest configuration that passes O1 in every fold with both
  # solvers. The explicit values below are only a fallback if none passes.
  auto_select_from_support: true
  token_count: 64
  history_count: 2
  match_mode: mutual
  radius_metric: 0.10

gating:
  # Reliable gate = original bounded fit + effective support + agreement
  # between the independently predicted depth and point heads.
  min_effective_correspondences: 6.0
  min_unique_current_correspondences: 6
  max_head_consistency_p90_metric: 0.60

  # Strict consensus additionally requires two independently solved instance
  # candidates to agree. Single-instance frames intentionally fall back.
  min_instance_candidates: 2
  max_instance_consensus_rotation_deg: 5.0
  max_instance_consensus_center_native: 0.25

  # A robust pass needs at least three of each fold's four test frames and no
  # accepted frame may worsen the GT-evaluated pose loss.
  min_active_fraction: 0.75
