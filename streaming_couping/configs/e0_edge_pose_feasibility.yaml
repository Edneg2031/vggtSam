# E0: isolated masked-edge pose feasibility diagnostic.
# This reads the retained V0 cache and never writes selected pose outputs.
e0:
  base_config: v0_baseline.yaml
  output_dir: outputs/streaming_couping_e0_edge_feasibility
  clip_name: 00a231a370_90_525_step15_37_68_54
  branches:
    - raw
    - all_edge
    - sam_static_edge
    - shuffled_static_mask
  frames:
    evaluation: [360, 375, 390, 405, 420, 435, 450, 465, 480, 495, 510, 525]
  edge:
    # Sobel threshold and top-k cap are fixed across branches.  The SAM/static
    # branches only change which edge pixels are masked out.
    sobel_quantile: 0.88
    max_edges_per_frame: 12000
    distance_truncate_px: 12
  projection:
    # Causal source frames only: target frame can consume prior offsets.
    source_offsets: [1, 2, 4]
    min_depth: 0.05
    max_depth: 25.0
    cycle_abs_depth_tolerance: 0.10
    cycle_rel_depth_tolerance: 0.10
