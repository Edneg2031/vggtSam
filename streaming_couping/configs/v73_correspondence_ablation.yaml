# V7.3 keeps the exact V7.1 L0 and retained V7.2 controls.  SAM3.1 local
# descriptors may determine correspondence weights, but transported Values are
# always StreamVGGT local geometry.
v72_config: streaming_couping/configs/v72_local_token_ablation.yaml
output_dir: outputs/streaming_couping_v73_correspondence
device: cuda:0

# Deliberately light.  K=32 is not included until K=8/16 establishes a causal
# SAM contribution rather than a capacity-only gain.
token_counts: [8, 16]
architectures:
  - uniform_transport
  - geometry_transport
  - sam_transport
  - sam_geometry_transport

training:
  residual_steps: 1200
  seed: 0
