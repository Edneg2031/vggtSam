# Read-only I0 follow-up over the frozen V0 dense cache. This experiment only
# measures causal SAM-indexed 3D correspondence support; it never creates a
# pointmap candidate and never reads GT geometry.
baseline_config: streaming_couping/configs/v0_baseline.yaml
output_dir: outputs/streaming_couping_v1/correspondence_sweep
device: cuda:0

eligibility:
  max_active_instances: 5
  geometry_excluded_prompts: [wardrobe]
  min_history_visible_frames: 4
  min_track_score: 0.50
  # Separate from the frozen r2 threshold (0.005). Only this area gate changes;
  # the r2 minimum of 256 valid pixels remains fixed.
  min_mask_area_ratio: 0.001
  max_mask_area_ratio: 0.25
  min_current_points: 256
  point_confidence_threshold: 0.30
  erosion_radius: 2

surfel:
  neighbors: 16
  min_support_frames: 3
  max_current_points_per_instance: 1024
  max_history_points_per_frame: 512
  max_history_points_total: 8192
  # Parsed by the shared V1 config loader but replaced by every sweep value.
  match_radius_scene_fraction: 0.010
  normal_variance_max: 0.20
  alpha: 0.50
  max_displacement_scene_fraction: 0.0025
  chunk_size: 256

controls:
  shifted_mask_y_fraction: 0.0625
  shifted_mask_x_fraction: 0.125

evaluation:
  symmetric_metric_points: 2048

sweep:
  match_radius_scene_fractions: [0.010, 0.025, 0.050]
  # Fixed before seeing sweep results. These gates use raw predictions only.
  minimum_correct_active_tracks: 2
  minimum_correct_valid_surfel_rate: 0.10
  minimum_valid_rate_ratio_vs_max_control: 2.0
