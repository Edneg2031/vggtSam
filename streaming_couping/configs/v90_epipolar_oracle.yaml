# V9 Stage O: visible 2D surface correspondence + fixed calibrated epipolar solver.
# This file intentionally contains one locked configuration, not a sweep.
data_config: streaming_couping/configs/v74_temporal_data.yaml
output_dir: outputs/streaming_couping_v90_epipolar_token_causality
clip_name: 00a231a370_90_525_step15_37_68_54

# Each dynamic SAM3.1 slot reads only its two latest strictly earlier masks.
max_history: 2

visibility:
  # Deterministic dense-mask samples. These are GT surface oracle labels, not
  # SAM local descriptors; Stage A will later use fixed 32-token support.
  max_queries_per_instance: 256
  depth_tolerance_metric: 0.03
  relative_depth_tolerance: 0.01

solver:
  min_correspondences: 8
  min_design_rank_ratio: 0.0000001
  min_cheirality_fraction: 0.50
  refinement_iterations: 5
  refinement_huber_delta: 0.002
  refinement_damping: 0.000001
  refinement_step_epsilon: 0.000001
  max_refinement_step: 0.10
  cheirality_max_points: 128
  ray_intersection_max_condition: 100000000.0

