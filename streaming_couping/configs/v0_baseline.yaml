# V0: dynamic SAM3.1 tracking plus unmodified StreamVGGT pose.
# Failed direct SE(3) and geometry-transport pose heads are not instantiated.
recovery_config: streaming_couping/configs/recovery_dynamic_instance.yaml
output_dir: outputs/streaming_couping_v0/data_stage

dataset:
  manifest: data/processed/scannetpp_pinhole_2d/manifest.json
  clips:
    - name: 00a231a370_90_525_step15_37_68_54
      scene_id: 00a231a370
      frame_indices: [90, 105, 120, 135, 150, 165, 180, 195, 210, 225, 240, 255, 270, 285, 300, 315, 330, 345, 360, 375, 390, 405, 420, 435, 450, 465, 480, 495, 510, 525]
      # Permanent capacity slots. A slot is assigned causally at first sight
      # and is never reused, so objects may first appear after frame 90.
      instance_ids: [0, 1, 2, 3, 4, 5, 6, 7]
      instance_source: sam31_online
      # SAM3.1 detects all instances of each configured open-vocabulary noun.
      # Add scene-relevant static concepts here; this is not class-agnostic.
      instance_prompts: [bed, wardrobe]
      reference_sequence_index: 0
      split: baseline

runtime:
  streamvggt_devices: [cuda:0, cuda:1]
  streamvggt_amp_dtype: bfloat16
  geometry_device: cuda:0
  sam3_device: cuda:2

features:
  # Reuse the retained dynamic-instance cache; do not duplicate the frozen
  # SAM3.1/StreamVGGT tensors under the much smaller V0 result directory.
  cache_dir: outputs/streaming_couping_v74_temporal_scaling/cache
  rebuild: false
  cache_sam_appearance: false
  sam_source: disabled_geometry_only_baseline
  sam_segmentation_variant: sam31_online_geometry_compete
  sam_resolution: 1008
  sam_grid: [72, 72]
  sam_batch_size: 0
  cache_sam_local_tokens: false
  geometry_prompt_point_confidence_threshold: 0.30
  point_confidence_threshold: 0.30
  min_instance_points: 128
  sampled_instance_points: 128

fusion:
  min_track_confidence: 0.50
  min_geometry_confidence: 0.20
  min_static_score: 0.20
  strict_identity_gate: true
  identity_hard_mismatch_min_points: 512
  identity_hard_mismatch_max_fitness: 0.02
  dpt_layer_indices: [4, 11, 17, 23]

baseline:
  version: v0
  output_dir: outputs/streaming_couping_v0
  clip_name: 00a231a370_90_525_step15_37_68_54
  audit_device: cuda:0
  frames:
    evaluation: [360, 375, 390, 405, 420, 435, 450, 465, 480, 495, 510, 525]
  # Independent pose candidate. It never changes the active V0 pose until
  # the fixed primary method passes all three future folds offline.
  track_ba_candidate:
    enabled: true
    # Keep the incompatible cached-token experiment as immutable evidence.
    output_dir: outputs/streaming_couping_v0/track_ba_keypoint_candidate
    device: cuda:0
    # TrackHead expects multi-frame features produced in one aggregator call.
    # Every call sees only the latest five frames up to the current frame.
    track_token_source: window_reaggregated
    # Upstream StreamVGGT BA queries TrackHead at detected keypoints, not a
    # uniform grid. Shi-Tomasi is deterministic and needs no learned model.
    query_source: shi_tomasi
    # Broad full-image support with only low-trust/identity-unknown SAM regions
    # removed. This choice is locked before reading future GT metrics.
    primary_method: sam_dynamic_excluded
    methods:
      - full_image
      - sam_dynamic_excluded
      - sam_instance_background_stratified
      - bbox_instance_background_stratified
      - random_instance_background_stratified
    window_frames: 5
    query_count: 256
    query_grid: [64, 64]
    track_iterations: 4
    # These are the official TrackHead confidence gates, not GT score gates.
    visibility_threshold: 0.05
    track_confidence_threshold: 0.05
    point_confidence_threshold: 0.30
    min_correspondences: 32
    optimizer_steps: 120
    learning_rate: 0.03
    robust_delta_pixels: 4.0
    rotation_prior_weight: 0.50
    translation_prior_weight: 0.50
    temporal_prior_weight: 0.10
    max_rotation_degrees: 10.0
    max_translation_scene_fraction: 0.25

  # Independent successor after TrackHead failed its one-frame query-slot
  # positive control. This uses explicit local-feature matches and PnP.
  feature_pnp_candidate:
    enabled: true
    # r2 evidence remains immutable in feature_pnp_candidate/.
    output_dir: outputs/streaming_couping_v0/feature_pnp_factor_candidate
    primary_method: sam_dynamic_excluded
    methods:
      - full_image
      - sam_dynamic_excluded
      - sam_instance_background_stratified
      - bbox_instance_background_stratified
      - random_instance_background_stratified
    # Fixed 2x2 diagnosis. The primary is locked before offline scoring.
    primary_landmark_source: native_world_pointmap
    landmark_sources: [raw_depth_unprojected, native_world_pointmap]
    primary_history_scope: all_causal
    history_scopes: [recent, all_causal]
    anchor_lookback: 4
    nfeatures: 4096
    contrast_threshold: 0.01
    ratio_threshold: 0.75
    max_correspondences: 256
    min_correspondences: 32
    min_inliers: 16
    point_confidence_threshold: 0.30
    ransac_iterations: 1000
    ransac_reprojection_pixels: 4.0
    ransac_confidence: 0.999
    max_rotation_degrees: 10.0
    max_translation_scene_fraction: 0.25
